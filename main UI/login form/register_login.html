<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
    <style>
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgb(0, 0, 22);
    margin: 0;
    font-family: Arial, sans-serif;
}

.register-container {
    background-color: #f5f5f5;
    width: 240px;
    padding: 56px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
}

.register-container h2 {
    color: rgb(98, 91, 91);
    font-size: 16px;
    margin-top: -4px;
    margin-bottom: 20px;
}

/* Role dropdown */
.register-container select {
    width: 62%;
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background-color: white;
    color: rgb(0, 0, 22);
    font-size: 14px;
    cursor: pointer;
    box-sizing: border-box;
}

/* Form inputs */
.register-container input {
    width: 100%;
    padding: 10px;
    margin-bottom: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
}

.register-container select:focus,
.register-container input:focus {
    outline: none;
    border-color: #ff6b35;
}

/* Button */
.register-container button {
    width: 50%;
    padding: 10px;
    border: none;
    border-radius: 13px;
    background-color: #ff6b35;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 6px;
    margin-bottom: 10px;
}

.register-container button:hover {
    background: rgb(0, 0, 22);
    color: aliceblue;
}

/* "Already have an account" text */
#logpara {
    font-size: 13px;
    color: rgb(98, 91, 91);
    margin-top: 10px;
}

#logpara a {
    color: #ff6b35;
    font-weight: bold;
    text-decoration: none;
}

#logpara a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Select Type for registration</h2>
        <select id="role">
            <option value="user">Select as User</option>
            <option value="admin">Select as Admin</option>
        </select>
        <form id="registrationForm">
            <input type="text" id="user-name" placeholder="Full Name">
            <input type="text" id="email"placeholder="Enter email"required>
            <input type="password" id="password"placeholder="password"required>
            <input type="password" id="confirm-password"placeholder="confirm-password"required>

            <br>
            <button type="submit">Submit</button>
        </form>
        <p id="logpara">
            If already have an Account
            <a href="main login.html">Login</a>
        </p>

    </div>
    
    <script>
 
const form = document.getElementById("registrationForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const user_name = document.getElementById("user-name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirm_password = document.getElementById("confirm-password").value;
    const user_role = document.getElementById("role").value;

    if (password !== confirm_password) {
        alert("Password does not match!");
        return;
    }

    try {

        const response = await fetch("http://localhost:3000/api/users/register", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                user_name,
                email,
                password,
                role: user_role
            })
        });

        const result = await response.json();

        if (response.ok) {
            alert("Registration successful!");
            form.reset();
        } else {
            alert(result.message || "Registration failed!");
        }

    } catch (error) {
        console.log(error);
        alert("Something went wrong. Check your server!");
    }

});

    </script>
</body>
</html>
