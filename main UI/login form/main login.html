<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capzone Login</title>
</head>
<style>
    
body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgb(0,0,22);

}

.login-container{
    background-color:#f5f5f5;
    width: 200px;
    padding: 56px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 15px rgb(0,0,0,0.3);
}

.login-container h1{
    color: rgb(0,0,22);
    margin-bottom: 14px;
    margin-top: -4px;
}

.login-container h2{
    color: rgb(98 91 91);
    font-size: 16px;
    margin-bottom: 28px;

}


button{
    width: 50%;
    padding: 10px;
    border: none;
    border-radius: 13px;
    background-color: #ff6b35;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;

}

.login-container button:hover{
    background:rgb(0,0,22);
    color: aliceblue;
}

</style>
<body>
    <div class="login-container">
        <h1>Login form</h1>
        <h2>Select login Type</h2>
    <button onclick="location.href='user_login.html'">User</button>
    <button onclick="location.href='admin_login.html'">Admin</button>
    <p id="para2">If you don't have an Account
        <a href="register_login.html">Register</a>
    </p>
    </div>
    
</body>
</html>
